<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peta Finding Project</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--ink:#17242b;--mute:#5d6b73;--line:#d9dfe2;--bg:#f4f6f7;--pri:#0b5c6b;--red:#d0201b;--grn:#2e7d32}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{height:100%;margin:0;font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
#app{display:flex;height:100%}
#side{width:350px;flex:none;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side header{padding:14px 16px 8px}
h1{font-size:19px;margin:0}.sub{margin:0 0 10px;color:var(--mute)}
.row{display:flex;gap:6px;margin-bottom:8px}
button,.btn,select{font:inherit;padding:6px 10px;border:1px solid #b9c3c8;border-radius:5px;background:#fff;color:var(--ink);cursor:pointer;flex:1;text-align:center}
select{min-width:0}
.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button:focus-visible,.btn:focus-within,select:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
#sum{font-weight:600}#msg{color:#a35a00;font-size:12px;min-height:16px}
#list{flex:1;overflow:auto;border-top:1px solid var(--line)}
.it{padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff}
.it:hover{background:#eaf2f4}.it small{display:block;color:var(--mute)}
.it .top{display:flex;justify-content:space-between;gap:8px}
.st{font-size:11px;padding:1px 8px;border-radius:9px;color:#fff;height:18px}.st.open{background:var(--red)}.st.close{background:var(--grn)}
#side footer{display:flex;gap:6px;padding:10px 16px;border-top:1px solid var(--line)}
#map{flex:1;min-width:0}
.mk{width:34px;height:34px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.55)}
.pp{font-size:13px;min-width:220px}.pp td{vertical-align:top;padding:1px 6px 1px 0}.pp td:first-child{color:var(--mute);white-space:nowrap}
.pp img{width:100%;border-radius:4px;margin-top:4px}.cap{font-size:11px;color:var(--mute)}
.sg{background:rgba(0,0,0,.7);color:#ffd60a;border:0;box-shadow:none;font-weight:700;font-size:11px;padding:1px 6px}.sg:before{display:none}
.lg{background:#fff;padding:8px 10px;border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.4);font-size:12px;line-height:22px}
.lg i{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:middle;margin-right:6px;text-align:center;color:#fff;font-style:normal;font-weight:700;line-height:18px}
#ph,#pt{display:none}
@media(max-width:700px){#app{flex-direction:column}#side{width:100%;height:48%}}
@media print{#side,.leaflet-control-zoom,.leaflet-control-layers{display:none!important}
#app{display:block;height:auto}#map{height:105mm!important;width:100%!important;border:1px solid #888}
#ph{display:block;margin:0 0 4mm;font-size:16px}
#pt{display:table;width:100%;border-collapse:collapse;font-size:10px;margin-top:5mm}
#pt th,#pt td{border:1px solid #888;padding:2px 4px;text-align:left;vertical-align:top}}
</style></head><body>
<div id="app">
<aside id="side">

<div class="row"><select id="fs" aria-label="Filter status"><option value="">Semua status</option><option value="open">Open</option><option value="close">Close</option></select><select id="ft" aria-label="Filter finding"><option value="">Semua finding</option></select></div>
<div class="row"><select id="fj" aria-label="Filter jalur"><option value="">Semua jalur</option></select></div>
<div id="sum"></div><div id="msg"></div></header>
<div id="list"></div>
<footer><button id="btnPrint">Cetak peta</button><button id="btnXls" class="pri">Ekspor XLSX</button></footer>
</aside>

const sat=L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&hl=id&x={x}&y={y}&z={z}',{maxZoom:20,subdomains:'0123',attribution:'© Google'}).addTo(map);
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
const PL=L.featureGroup().addTo(map),PP=L.featureGroup(),G=L.featureGroup().addTo(map);
D.lines.forEach(l=>L.polyline(l.c,{color:'#ffd60a',weight:3,opacity:.9}).bindTooltip(l.n,{permanent:true,direction:'center',className:'sg'}).addTo(PL));
D.pins.forEach(p=>L.circleMarker([p.la,p.lo],{radius:3,color:'#fff',weight:1,fillColor:'#0b5c6b',fillOpacity:1}).bindTooltip(p.n,{direction:'top'}).addTo(PP));
map.fitBounds(PL.getBounds());
L.control.layers({'Satelit':sat,'Peta':osm},{'Jalur pipa':PL,'Titik PKM':PP,'Finding':G}).addTo(map);
const lg=L.control({position:'bottomright'});
lg.onAdd=()=>{const d=L.DomUtil.create('div','lg');d.innerHTML='<div id="lgSeg" style="font-weight:700;display:none"></div><div><i style="background:#d0201b">!</i>Open (merah)</div><div><i style="background:#2e7d32">!</i>Close (hijau)</div><div><i style="background:#555"><svg viewBox="0 0 24 24" width="12" height="12" style="vertical-align:-1px"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z" fill="#fff"/></svg></i>Bangunan</div><div><i style="background:#555"><svg viewBox="0 0 24 24" width="12" height="12" style="vertical-align:-1px"><path d="M9 3h6l5 18H4z" fill="#fff"/><path d="M12 5v3m0 3v3m0 3v2" stroke="#555" stroke-width="1.8"/></svg></i>Jalan</div><div><i style="background:#ffd60a;border-radius:2px;height:4px;margin-bottom:2px"></i>Jalur pipa</div>';return d};
lg.addTo(map);
let gErr=0;
sat.on('tileerror',()=>{if(++gErr>=6&&map.hasLayer(sat)){map.removeLayer(sat);map.addLayer(esri)}});

/* filter jalur */
let SEG='';
const fj=$('fj');
const JK=[];D.lines.forEach(l=>{const k=nk(l.n);if(!JK.some(j=>j.k==k))JK.push({k,n:l.n})});
JK.sort((a,b)=>a.n.localeCompare(b.n));
fj.innerHTML='<option value="">Semua jalur</option>'+JK.map(j=>`<option value="${j.k}">${esc(j.n)}</option>`).join('');
const same=(a,b)=>{a=nk(a);b=nk(b);return !!a&&!!b&&(a==b||a.includes(b)||b.includes(a))};
const segOk=r=>!SEG||same(r.seg,SEG);
function jalur(){
SEG=fj.value;PL.clearLayers();
D.lines.forEach(l=>{if(!SEG||nk(l.n)==SEG)L.polyline(l.c,{color:'#ffd60a',weight:SEG?5:3,opacity:.95}).bindTooltip(l.n,{permanent:!SEG,sticky:!!SEG,direction:'center',className:'sg'}).addTo(PL)});
const e=document.getElementById('lgSeg');if(e){e.style.display=SEG?'block':'none';e.textContent=SEG?JK.find(j=>j.k==SEG).n:''}
draw(false);map.fitBounds(PL.getBounds().pad(.1))}
fj.onchange=jalur;

/* ikon */
function icon(r){const c=isClose(r)?'#2e7d32':'#d0201b',t=type(r.fnd);
const g=t=='b'?'<path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z" fill="#fff"/>':t=='r'?`<path d="M9 3h6l5 18H4z" fill="#fff"/><path d="M12 5v3m0 3v3m0 3v2" stroke="${c}" stroke-width="1.8"/>`:'<path d="M10.8 4h2.4v10h-2.4zM10.8 16.6h2.4V19h-2.4z" fill="#fff"/>';
return L.divIcon({className:'',iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-16],html:`<div class="mk" style="background:${c}"><svg viewBox="0 0 24 24" width="20" height="20">${g}</svg></div>`})}
function img(u){u=String(u||'').trim();const m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)|[?&]id=([\w-]+)/);return m?`https://drive.google.com/thumbnail?id=${m[1]||m[2]}&sz=w600`:u}
function pop(r){
const ph=(u,t)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(img(u))}" alt="${t}" onerror="this.parentNode.textContent='Foto tidak bisa dimuat, klik untuk membuka link'"></a><div class="cap">${t}</div>`:'';
const row=(k,v)=>v?`<tr><td>${k}</td><td>${esc(v)}</td></tr>`:'';
return `<div class="pp"><table>${row('Kode',r.kode)}${row('Tanggal',r.tgl)}${row('No PKM',r.pkm)}${row('Segmen',r.seg)}${row('Finding',r.fnd)}${row('Status',r.st)}${row('Koordinat',r.la.toFixed(6)+', '+r.lo.toFixed(6))}${row('Keterangan',r.nama)}${row('Update',r.upd)}</table>${ph(r.foto,'Foto di titik')}${ph(r.fotou,'Foto terupdate')}</div>`}

/* data */
let R=[],F=[],M=[];
try{R=JSON.parse(localStorage.getItem('fp')||'[]')}catch(e){}
function dt(d){return d instanceof Date?new Date(d.getTime()+432e5).toISOString().slice(0,10):String(d).trim().slice(0,10)}
function coord(r){let a,b;
if(r.la!==''&&r.lo!==''){a=parseFloat(String(r.la).replace(',','.'));b=parseFloat(String(r.lo).replace(',','.'))}
else{const m=String(r.koor).replace(/;/g,' ').match(/-?\d+\.?\d*/g);if(!m||m.length<2)return null;a=+m[0];b=+m[1]}
if(isNaN(a)||isNaN(b))return null;if(Math.abs(a)>90){const t=a;a=b;b=t}
return Math.abs(a)<=90&&Math.abs(b)<=180?[a,b]:null}
function ingest(rows){let skip=0;R=[];
rows.forEach(o=>{const n={};for(const k in o)n[nk(k)]=o[k];const r={};for(const k in A)r[k]=pick(n,A[k]);
const c=coord(r);if(!c){if(Object.values(r).some(v=>v!==''))skip++;return}
r.la=c[0];r.lo=c[1];r.tgl=r.tgl===''?'':dt(r.tgl);
['pkm','seg','fnd','nama','upd','foto','fotou','st','kode'].forEach(k=>r[k]=String(r[k]).trim());
delete r.koor;R.push(r)});
try{localStorage.setItem('fp',JSON.stringify(R))}catch(e){}
$('msg').textContent=skip?skip+' baris dilewati: koordinat tidak terbaca (format: lat, lon).':'';
$('fs').value='';$('ft').value='';draw(true)}
function draw(fit){
const ft=$('ft'),keep=ft.value;
ft.innerHTML='<option value="">Semua finding</option>'+[...new Set(R.map(r=>r.fnd).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join('');ft.value=keep;
const s=$('fs').value,t=ft.value;
F=R.filter(r=>(!s||(isClose(r)?'close':'open')==s)&&(!t||r.fnd==t)&&segOk(r));
G.clearLayers();M=F.map(r=>L.marker([r.la,r.lo],{icon:icon(r),title:r.kode||r.fnd}).bindPopup(pop(r),{maxWidth:300}).addTo(G));
const c=F.filter(isClose).length;
$('sum').textContent=`${F.length} finding: ${F.length-c} open, ${c} close`;
$('list').innerHTML=F.length?F.map((r,i)=>`<div class="it" data-i="${i}"><div class="top"><b>${esc(r.kode||'(tanpa kode)')} ${esc(r.fnd)}</b><span class="st ${isClose(r)?'close':'open'}">${isClose(r)?'Close':'Open'}</span></div><small>PKM ${esc(r.pkm)} - ${esc(r.seg)}</small><small>${esc(r.nama)}</small></div>`).join(''):'<div class="it">Belum ada data. Impor file Excel/CSV atau klik Contoh.</div>';
document.querySelector('#pt tbody').innerHTML=F.map(r=>`<tr><td>${esc(r.kode)}</td><td>${esc(r.tgl)}</td><td>${esc(r.pkm)}</td><td>${esc(r.seg)}</td><td>${esc(r.fnd)}</td><td>${esc(r.st)}</td><td>${esc(r.nama)}</td><td>${esc(r.upd)}</td></tr>`).join('');
if(fit&&F.length)map.fitBounds(G.getBounds().pad(.3),{maxZoom:16})}

/* aksi */
$('list').onclick=e=>{const it=e.target.closest('.it');if(!it||it.dataset.i==null)return;const i=+it.dataset.i;map.setView([F[i].la,F[i].lo],17);M[i].openPopup()};
$('fs').onchange=$('ft').onchange=()=>draw(true);
$('f').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
rd.onload=()=>{const wb=XLSX.read(rd.result,{type:'array',cellDates:true});ingest(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}))};
rd.readAsArrayBuffer(f);e.target.value=''};
const demo=()=>S.map(r=>Object.fromEntries(H.map((h,i)=>[h,r[i]])));
$('btnDemo').onclick=()=>ingest(demo());
$('btnTpl').onclick=()=>{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([H,...S]),'Finding');XLSX.writeFile(wb,'template-finding.xlsx')};
$('btnXls').onclick=()=>{if(!F.length){$('msg').textContent='Tidak ada data untuk diekspor.';return}
const rows=F.map(r=>({'Tanggal':r.tgl,'No PKM':r.pkm,'Segmen Jalur':r.seg,'Koordinat':r.la.toFixed(6)+', '+r.lo.toFixed(6),'Finding':r.fnd,'Nama Keterangan':r.nama,'Keterangan Update':r.upd,'Foto':r.foto,'Foto Update':r.fotou,'Status':r.st,'Kode Finding':r.kode}));
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Finding');XLSX.writeFile(wb,'finding-'+new Date().toISOString().slice(0,10)+'.xlsx')};
$('btnPrint').onclick=()=>{if(F.length)map.fitBounds(G.getBounds().pad(.3),{maxZoom:16,animate:false});setTimeout(()=>window.print(),700)};
window.addEventListener('beforeprint',()=>{$('ph').textContent='Peta Finding Project - '+new Date().toLocaleDateString('id-ID');map.invalidateSize();if(F.length)map.fitBounds(G.getBounds().pad(.3),{maxZoom:16,animate:false})});
window.addEventListener('afterprint',()=>map.invalidateSize());
draw(R.length>0);
</script></body></html>
