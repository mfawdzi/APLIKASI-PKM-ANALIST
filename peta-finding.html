<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peta Finding Project</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--ink:#17242b;--mute:#5d6b73;--line:#d9dfe2;--bg:#f4f6f7;--pri:#0b5c6b;--red:#d0201b;--grn:#2e7d32}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{height:100%;margin:0;font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
#app{display:flex;height:100%}
#side{width:350px;flex:none;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side header{padding:14px 16px 8px}
h1{font-size:19px;margin:0}.sub{margin:0 0 10px;color:var(--mute)}
.row{display:flex;gap:6px;margin-bottom:8px}
button,.btn,select{font:inherit;padding:6px 10px;border:1px solid #b9c3c8;border-radius:5px;background:#fff;color:var(--ink);cursor:pointer;flex:1;text-align:center}
select{min-width:0}
input[type=search]{font:inherit;padding:6px 10px;border:1px solid #b9c3c8;border-radius:5px;flex:1;min-width:0;background:#fff;color:var(--ink)}
.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button:focus-visible,.btn:focus-within,select:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
#sum{font-weight:600}#msg{color:#a35a00;font-size:12px;min-height:16px}
#list{flex:1;overflow:auto;border-top:1px solid var(--line)}
.it{padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff}
.it:hover{background:#eaf2f4}.it small{display:block;color:var(--mute)}
.del{flex:none;width:22px;height:22px;padding:0;line-height:1;border-radius:50%;color:#b00;border-color:#e3b3b3;font-weight:700;font-size:15px}.del:hover{background:#fdeaea}
.it .top{display:flex;justify-content:space-between;gap:8px}
.st{font-size:11px;padding:1px 8px;border-radius:9px;color:#fff;height:18px}.st.open{background:var(--red)}.st.close{background:var(--grn)}
.kw{display:inline-block;padding:0 6px;border-radius:5px}
body.kw-on .kw.open{background:#ffe600;color:#111}
body.kw-on .kw.close{background:#2f8cff;color:#fff}
body.kw-on .mkl.kwo{color:#ffe600!important}
body.kw-on .mkl.kwc{color:#2f8cff!important}
.tg{flex:none;display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap;cursor:pointer;user-select:none}
.tg input{display:none}
.tg i{position:relative;width:34px;height:18px;border-radius:9px;background:#b9c3c8;transition:.2s}
.tg i:after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.tg input:checked+i{background:var(--pri)}
.tg input:checked+i:after{left:18px}
#side footer{display:flex;gap:6px;padding:10px 16px;border-top:1px solid var(--line)}
#map{flex:1;min-width:0}
.mk{width:28px;height:28px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;box-shadow:0 4px 6px rgba(0,0,0,.6),inset 0 -3px 5px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.4);opacity:.9;position:relative}.mk:after{content:'';position:absolute;inset:1px;border-radius:50%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.55),rgba(255,255,255,0) 55%);pointer-events:none}
.leaflet-marker-icon:hover .mk{opacity:1}
.mk3{background:none!important;border:0!important;box-shadow:none!important;opacity:1!important;overflow:visible}
.mk3:after{display:none}
.mk3 svg{width:24px;height:24px;filter:drop-shadow(1px 0 0 var(--c)) drop-shadow(-1px 0 0 var(--c)) drop-shadow(0 1px 0 var(--c)) drop-shadow(0 -1px 0 var(--c)) drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.mkw{width:28px;height:28px;transform-origin:14px 14px}
.pp{font-size:13px;min-width:220px}.pp td{vertical-align:top;padding:1px 6px 1px 0}.pp td:first-child{color:var(--mute);white-space:nowrap}
.pp .fw{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.pp .fo{flex:0 1 calc(50% - 3px);min-width:0}.pp .fo.big{flex:1 1 100%}
.pp img{width:100%;height:90px;object-fit:cover;border-radius:4px;display:block;cursor:zoom-in}.pp .big img{height:auto;cursor:zoom-out}.cap{font-size:11px;color:var(--mute)}
.sg{background:rgba(0,0,0,.7);color:#ffd60a;border:0;box-shadow:none;font-weight:700;font-size:11px;padding:1px 6px}.sg:before{display:none}
.lg{background:rgba(255,255,255,.35);padding:8px 10px;border-radius:6px;box-shadow:0 0 10px rgba(255,255,255,.4),0 1px 4px rgba(0,0,0,.3);font-size:12px;line-height:22px;font-weight:700;color:#0d1a20;text-shadow:0 0 3px #fff,0 0 6px #fff,0 0 10px rgba(255,255,255,.95)}
.lg i{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:middle;margin-right:6px;text-align:center;color:#fff;font-style:normal;font-weight:700;line-height:18px;text-shadow:none;border:1.5px solid #fff;box-shadow:0 0 6px rgba(255,255,255,.9)}
.mkl{position:absolute;top:31px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#fff;font:700 12px/14px system-ui,"Segoe UI",sans-serif;padding:0 2px;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 4px #000,0 0 7px #000}
#files{max-height:92px;overflow:auto}
#files .fi{display:flex;align-items:center;gap:6px;padding:3px 8px;margin-bottom:3px;background:#fff;border:1px solid var(--line);border-radius:5px;font-size:12px}
#files .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#files .fc{flex:none;color:var(--mute)}
#ph,#pt{display:none}
body.pv #side{display:none}
#grip{display:none}
@media(max-width:700px){
#app{display:block;position:relative;height:100%}
#map{position:absolute;inset:0;width:100%;height:100%}
#side{position:absolute;left:0;right:0;bottom:0;z-index:1200;width:100%;height:62%;border-right:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.3);overflow-y:auto;transition:transform .25s ease}
#side.tutup{transform:translateY(calc(100% - 46px))}
#grip{display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:5;height:46px;flex:none;background:var(--pri);color:#fff;font-weight:700;cursor:pointer;border-radius:14px 14px 0 0;user-select:none}
#side header{padding:10px 12px 6px}
#side h1{font-size:16px}
.sub{display:none}
select,input[type=search]{font-size:16px;min-height:40px}
button,.btn{min-height:40px}
#list{flex:none;overflow:visible}
.it{padding:12px 14px}
.del{width:30px;height:30px}
#side footer{position:sticky;bottom:0;background:var(--bg);padding:8px 12px;z-index:5}
.leaflet-bottom{bottom:46px}
.leaflet-popup-content-wrapper,.leaflet-popup-content{max-width:80vw}
.leaflet-popup-content{max-height:45vh;overflow-y:auto}
.pp{min-width:0}
.lg{font-size:10px;line-height:18px;padding:5px 7px}
}
@media print{#side,.leaflet-control-zoom,.leaflet-control-layers{display:none!important}
#app{display:block;height:auto}#map{height:105mm!important;width:100%!important;border:1px solid #888}
#ph{display:block;margin:0 0 4mm;font-size:16px}
#pt{display:table;width:100%;border-collapse:collapse;font-size:10px;margin-top:5mm}
#pt th,#pt td{border:1px solid #888;padding:2px 4px;text-align:left;vertical-align:top}}

<div class="row"><button id="btnAddF" class="pri">+ Tambah finding</button></div>
<div id="files"></div><div id="sum"></div><div id="msg"></div></header>
<div id="list"></div>
<footer><button id="btnPrint">Simpan peta (PNG)</button><button id="btnXls" class="pri">Ekspor XLSX</button></footer>

ov.innerHTML='<div class="grb" role="dialog" aria-label="Grafik data finding"><div class="grh"><b>Grafik Data Finding</b><span class="grn"></span><button type="button" class="gru">⬇ UNDUH GRAFIK</button><button type="button" class="grt">⬇ Template Excel</button><button type="button" class="grx" aria-label="Tutup">✕</button></div><div class="grc"></div></div>';
document.body.appendChild(ov);
const cnt=ov.querySelector('.grc'),info=ov.querySelector('.grn');

const OP='#ffe600',CL='#2f8cff';
const kat=[['b','Illegal Building'],['r','Illegal Road Crossing'],['p','Pipe Exposed'],['o','Lainnya']];
const grad=(k,a,b,c,d,e,f)=>'<linearGradient id="g'+k+'f" x1="0" x2="1"><stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient><linearGradient id="g'+k+'s" x1="0" x2="1"><stop offset="0" stop-color="'+c+'"/><stop offset="1" stop-color="'+d+'"/></linearGradient><linearGradient id="g'+k+'t" x1="0" x2="1"><stop offset="0" stop-color="'+e+'"/><stop offset="1" stop-color="'+f+'"/></linearGradient>';
const DEFS='<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>'+grad('o','#fff27a','#ffd000','#c9a400','#8f7300','#fffbc2','#fff07a')+grad('c','#6db0ff','#1f6fe0','#1a58b8','#102f6b','#a9d0ff','#74b3ff')+'<filter id="gblur"><feGaussianBlur stdDeviation="5"/></filter></defs></svg>';

function hitung(D){
const k={};kat.forEach(x=>k[x[0]]={n:x[1],o:0,c:0});
const sg={};let o=0,c=0;
D.forEach(r=>{const cl=isClose(r);cl?c++:o++;k[type(r.fnd)][cl?'c':'o']++;
const key=nk(r.seg||'')||'-';(sg[key]=sg[key]||{n:r.seg||'Tanpa segmen',o:0,c:0})[cl?'c':'o']++});
return{o,c,t:o+c,k:kat.map(x=>k[x[0]]).filter((v,i)=>i<3||v.o+v.c>0),s:Object.values(sg).sort((a,b)=>(b.o+b.c)-(a.o+a.c))}}

const cut=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
function wrap(s){const w=s.split(' ');if(s.length<=13||w.length<2)return[s];const h=Math.ceil(w.length/2);return[w.slice(0,h).join(' '),w.slice(h).join(' ')]}

/* balok 3D (isometrik) tegak */
function box(x,yb,w,h,dx,dy,k,tip,dl){
if(h<=0)return'';
return '<g class="bar" style="animation-delay:'+dl+'ms"><title>'+esc(tip)+'</title>'
+'<rect x="'+x+'" y="'+(yb-h)+'" width="'+w+'" height="'+h+'" fill="url(#g'+k+'f)"/>'
+'<polygon points="'+(x+w)+','+(yb-h)+' '+(x+w+dx)+','+(yb-h-dy)+' '+(x+w+dx)+','+(yb-dy)+' '+(x+w)+','+yb+'" fill="url(#g'+k+'s)"/>'
+'<polygon points="'+x+','+(yb-h)+' '+(x+dx)+','+(yb-h-dy)+' '+(x+w+dx)+','+(yb-h-dy)+' '+(x+w)+','+(yb-h)+'" fill="url(#g'+k+'t)"/></g>'}

/* balok 3D mendatar */
function hbox(x,y,w,h,dx,dy,k,tip,dl,cap){
if(w<=0)return'';
return '<g class="barh" style="animation-delay:'+dl+'ms"><title>'+esc(tip)+'</title>'
+'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="url(#g'+k+'f)"/>'
+'<polygon points="'+x+','+y+' '+(x+dx)+','+(y-dy)+' '+(x+w+dx)+','+(y-dy)+' '+(x+w)+','+y+'" fill="url(#g'+k+'t)"/>'
+(cap?'<polygon points="'+(x+w)+','+y+' '+(x+w+dx)+','+(y-dy)+' '+(x+w+dx)+','+(y+h-dy)+' '+(x+w)+','+(y+h)+'" fill="url(#g'+k+'s)"/>':'')+'</g>'}

function donat(d){
const R0=62,sw=30,C=2*Math.PI*R0,po=d.o/d.t*C,pc=d.c/d.t*C;
const ring=(a,b)=>(d.o?'<circle r="'+R0+'" fill="none" stroke="'+a+'" stroke-width="'+sw+'" stroke-dasharray="'+po+' '+(C-po)+'" transform="rotate(-90)"><title>Open: '+d.o+'</title></circle>':'')
+(d.c?'<circle r="'+R0+'" fill="none" stroke="'+b+'" stroke-width="'+sw+'" stroke-dasharray="'+pc+' '+(C-pc)+'" stroke-dashoffset="'+(-po)+'" transform="rotate(-90)"><title>Close: '+d.c+'</title></circle>':'');
let side='';for(let i=16;i>0;i-=2)side+='<g transform="translate(0,'+i+')"><g transform="scale(1,.58)">'+ring('#9c7d00','#123f86')+'</g></g>';
const pct=v=>Math.round(v/d.t*100);
return '<svg viewBox="-110 -62 220 150" role="img" aria-label="Open '+d.o+', Close '+d.c+'">'
+'<ellipse cx="0" cy="40" rx="86" ry="16" fill="#000" opacity=".45" filter="url(#gblur)"/>'
+'<g class="dn">'+side+'<g transform="scale(1,.58)">'+ring(OP,CL)+'<circle r="'+(R0+sw/2-2)+'" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/></g></g>'
+'<text y="2" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">'+d.t+'</text><text y="17" text-anchor="middle" fill="#9fb0c6" font-size="10">finding</text></svg>'
+'<div class="grl"><span><i style="background:'+OP+'"></i>Open '+d.o+' ('+pct(d.o)+'%)</span><span><i style="background:'+CL+'"></i>Close '+d.c+' ('+pct(d.c)+'%)</span></div>'}

function kolom(d){
const L=44,R=500,yb=252,top=34,dx=12,dy=7,n=d.k.length;
const mx=Math.max(1,...d.k.map(v=>Math.max(v.o,v.c))),step=mx<=5?1:Math.ceil(mx/5),tm=Math.ceil(mx/step)*step,sc=(yb-top)/tm;
let g='<polygon points="'+L+','+yb+' '+R+','+yb+' '+(R+14)+','+(yb-8)+' '+(L+14)+','+(yb-8)+'" fill="rgba(255,255,255,.07)"/>';
for(let v=0;v<=tm;v+=step){const y=yb-v*sc;g+='<line x1="'+(L+14)+'" y1="'+(y-8)+'" x2="'+(R+14)+'" y2="'+(y-8)+'" stroke="rgba(255,255,255,.12)"/><text x="'+(L+6)+'" y="'+(y-4)+'" text-anchor="end" fill="#9fb0c6" font-size="10">'+v+'</text>'}
const slot=(R-L)/n,bw=Math.min(40,slot*.27);
d.k.forEach((v,i)=>{const cx=L+slot*(i+.5),xo=cx-bw-3,xc=cx+3,dl=i*90;
g+=box(xo,yb,bw,v.o*sc,dx,dy,'o',v.n+' — Open: '+v.o,dl)+box(xc,yb,bw,v.c*sc,dx,dy,'c',v.n+' — Close: '+v.c,dl+45);
if(v.o)g+='<text x="'+(xo+(bw+dx)/2)+'" y="'+(yb-v.o*sc-dy-4)+'" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">'+v.o+'</text>';
if(v.c)g+='<text x="'+(xc+(bw+dx)/2)+'" y="'+(yb-v.c*sc-dy-4)+'" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">'+v.c+'</text>';
wrap(v.n).forEach((t,j)=>{g+='<text x="'+(cx+dx/2)+'" y="'+(yb+18+j*13)+'" text-anchor="middle" fill="#cfdaea" font-size="11">'+esc(t)+'</text>'})});
return '<svg viewBox="0 0 520 300" role="img" aria-label="Jumlah finding per jenis">'+g+'</svg><div class="grl"><span><i style="background:'+OP+'"></i>Open</span><span><i style="background:'+CL+'"></i>Close</span></div>'}

function segmen(d){
const rows=d.s.slice(0,8),RH=52,Lx=170,Rx=480,dx=9,dy=6,bh=18,H=rows.length*RH+24;
const mx=Math.max(1,...rows.map(s=>s.o+s.c)),sc=(Rx-Lx-dx-70)/mx;
let g='';
rows.forEach((s,i)=>{const y=30+i*RH,wo=s.o*sc,wc=s.c*sc,t=s.o+s.c,xo=Lx+wo/2+dx/2,xc=Lx+wo+wc/2+dx/2,gp=s.o&&s.c?Math.max(0,20-(xc-xo))/2:0;
g+='<line x1="'+Lx+'" y1="'+(y+bh+9)+'" x2="'+(Rx+dx)+'" y2="'+(y+bh+9)+'" stroke="rgba(255,255,255,.08)"/>'
+'<text x="'+(Lx-10)+'" y="'+(y+bh/2+4)+'" text-anchor="end" fill="#cfdaea" font-size="11"><title>'+esc(s.n)+'</title>'+esc(cut(s.n,26))+'</text>'
+hbox(Lx,y,wo,bh,dx,dy,'o',s.n+' — Open: '+s.o,i*70,!s.c)+hbox(Lx+wo,y,wc,bh,dx,dy,'c',s.n+' — Close: '+s.c,i*70+40,true)
+(s.o?'<text x="'+(xo-gp)+'" y="'+(y-dy-4)+'" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">'+s.o+'</text>':'')
+(s.c?'<text x="'+(xc+gp)+'" y="'+(y-dy-4)+'" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">'+s.c+'</text>':'')
+'<text x="'+(Lx+wo+wc+dx+8)+'" y="'+(y+bh/2+4)+'" fill="#fff" font-size="13" font-weight="700">Total '+t+'</text>'});
return '<svg viewBox="0 0 520 '+H+'" role="img" aria-label="Jumlah finding per segmen">'+g+'</svg><div class="grl"><span><i style="background:'+OP+'"></i>Open</span><span><i style="background:'+CL+'"></i>Close</span>'+(d.s.length>8?'<span>8 segmen teratas dari '+d.s.length+'</span>':'')+'</div>'}

function render(){
const d=hitung(F);
info.textContent=d.t?d.t+' finding · mengikuti filter yang aktif':'';
if(!d.t){cnt.innerHTML='<div class="gre">Belum ada data finding untuk ditampilkan.<br>Impor data atau ubah filter terlebih dahulu.</div>';return}
const kp=(l,v,c)=>'<div><small>'+l+'</small><b'+(c?' style="color:'+c+'"':'')+'>'+v+'</b></div>';
cnt.innerHTML=DEFS+'<div class="grk">'+kp('Total finding',d.t)+kp('Open',d.o,OP)+kp('Close',d.c,CL)+kp('Selesai',Math.round(d.c/d.t*100)+'%')+kp('Segmen jalur',d.s.length)+'</div>'
+'<div class="grg"><section><h3>Status Finding</h3>'+donat(d)+'</section><section><h3>Jenis Finding</h3>'+kolom(d)+'</section><section class="grw"><h3>Finding per Segmen Jalur</h3>'+segmen(d)+'</section></div>'}

/* ===== UNDUH GRAFIK (PNG) ===== */
const FONT='system-ui,"Segoe UI",Roboto,Arial,sans-serif';
function svgImg(s){return new Promise((ok,no)=>{
const c=s.cloneNode(true),v=s.getAttribute('viewBox').split(/\s+/).map(Number);
c.setAttribute('xmlns','http://www.w3.org/2000/svg');c.setAttribute('width',v[2]*3);c.setAttribute('height',v[3]*3);c.setAttribute('font-family',FONT);
c.insertAdjacentHTML('afterbegin',DEFS.replace(/^<svg[^>]*>|<\/svg>$/g,''));
const u=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(c)],{type:'image/svg+xml;charset=utf-8'})),im=new Image();
im.onload=()=>{URL.revokeObjectURL(u);ok({im,w:v[2],h:v[3]})};
im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('gambar grafik gagal dibuat'))};im.src=u})}
function rr(x,X,Y,W,H,r,f,s){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath();if(f){x.fillStyle=f;x.fill()}if(s){x.strokeStyle=s;x.lineWidth=1;x.stroke()}}
const lgItems=sec=>Array.from(sec.querySelectorAll('.grl span')).map(s=>{const i=s.querySelector('i');return{c:i?i.style.background:'',t:s.textContent}});
function leg(x,it,cx,y){x.font='12px '+FONT;x.textAlign='left';const sz=10,gp=18,w=it.map(t=>(t.c?sz+6:0)+x.measureText(t.t).width);
let px=cx-(w.reduce((a,b)=>a+b,0)+gp*(it.length-1))/2;
it.forEach((t,i)=>{if(t.c)rr(x,px,y-9,sz,sz,3,t.c);x.fillStyle='#cfdaea';x.fillText(t.t,px+(t.c?sz+6:0),y);px+=w[i]+gp})}
const fit=(im,iw,mh)=>{const w=Math.min(iw,mh*im.w/im.h);return{w,h:w*im.h/im.w}};
const ch=(im,W,mh)=>34+fit(im,W-28,mh).h+36;
function card(x,X,Y,W,H,ti,im,it,mh){const f=fit(im,W-28,mh);
rr(x,X,Y,W,H,14,'rgba(255,255,255,.07)','rgba(255,255,255,.12)');
x.font='600 13px '+FONT;x.fillStyle='#cfdaea';x.textAlign='left';x.fillText(ti,X+14,Y+24);
x.drawImage(im.im,X+(W-f.w)/2,Y+34+(H-70-f.h)/2,f.w,f.h);leg(x,it,X+W/2,Y+H-14)}
async function gambar(sec){
const d=hitung(F),S=2,P=24,W=sec?760:1200,IW=W-2*P,HH=64,tg=new Date(),
sub=d.t+' finding · dibuat '+tg.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})+' '+tg.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const secs=sec?[sec]:Array.from(cnt.querySelectorAll('section'));
const ims=await Promise.all(secs.map(s=>svgImg(s.querySelector('svg'))));
const ti=secs.map(s=>s.querySelector('h3').childNodes[0].textContent);
const kp=sec?[]:Array.from(cnt.querySelectorAll('.grk>div')).map(e=>({l:e.querySelector('small').textContent,v:e.querySelector('b').textContent,c:e.querySelector('b').style.color||'#fff'}));
let H=P+HH;const lay=[];
if(sec){const h=ch(ims[0],IW,560);lay.push({X:P,Y:H,W:IW,i:0,h,mh:560});H+=h}
else{H+=66+16;const w2=(IW-14)/2,h2=Math.max(ch(ims[0],w2,320),ch(ims[1],w2,320));
lay.push({X:P,Y:H,W:w2,i:0,h:h2,mh:320},{X:P+w2+14,Y:H,W:w2,i:1,h:h2,mh:320});H+=h2+14;
const h3=ch(ims[2],IW,640);lay.push({X:P,Y:H,W:IW,i:2,h:h3,mh:640});H+=h3}
H+=P;
const cv=document.createElement('canvas');cv.width=Math.round(W*S);cv.height=Math.round(H*S);
const x=cv.getContext('2d');x.scale(S,S);
const bg=x.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0f1b2d');bg.addColorStop(.55,'#16263d');bg.addColorStop(1,'#0b1424');
x.fillStyle=bg;x.fillRect(0,0,W,H);x.textBaseline='alphabetic';x.textAlign='left';
x.font='700 22px '+FONT;x.fillStyle='#e8eef7';x.fillText('Grafik Data Finding',P,P+26);
x.font='12px '+FONT;x.fillStyle='#9fb0c6';x.fillText(sub,P,P+46);
if(!sec){const w=(IW-4*12)/5,y=P+HH;kp.forEach((k,i)=>{const X=P+i*(w+12);rr(x,X,y,w,66,12,'rgba(255,255,255,.08)','rgba(255,255,255,.12)');
x.font='11px '+FONT;x.fillStyle='#9fb0c6';x.fillText(k.l,X+14,y+22);x.font='700 24px '+FONT;x.fillStyle=k.c;x.fillText(k.v,X+14,y+51)})}
lay.forEach(l=>card(x,l.X,l.Y,l.W,l.h,ti[l.i],ims[l.i],lgItems(secs[l.i]),l.mh));
return cv}
async function unduh(sec,b){const t=b.textContent;b.disabled=true;b.textContent='Memproses…';
try{const cv=await gambar(sec),tg=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),
nm='grafik-finding'+(sec?'-'+sec.querySelector('h3').childNodes[0].textContent.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''):'')+'-'+tg+'.png';
await new Promise(r=>cv.toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=nm;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1e4);r()},'image/png'))}
catch(e){alert('Gagal mengunduh grafik: '+e.message)}
b.disabled=false;b.textContent=t}
function pasang(){cnt.querySelectorAll('section h3').forEach(h=>h.insertAdjacentHTML('beforeend','<button type="button" class="gp" title="Unduh grafik ini">⬇ PNG</button>'))}
ov.querySelector('.gru').onclick=e=>{if(cnt.querySelector('section'))unduh(null,e.currentTarget)};
cnt.addEventListener('click',e=>{const b=e.target.closest('.gp');if(b)unduh(b.closest('section'),b)});

const buka=()=>{render();pasang();ov.classList.add('on')},tutup=()=>ov.classList.remove('on');
const bt=$('btnTpl');bt.textContent='Grafik';bt.title='Grafik data finding (3D)';bt.onclick=buka;
ov.querySelector('.grx').onclick=tutup;
ov.querySelector('.grt').onclick=()=>window.dlTpl&&window.dlTpl();
ov.addEventListener('mousedown',e=>{if(e.target===ov)tutup()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&ov.classList.contains('on'))tutup()});
})();

</script></body></html>
