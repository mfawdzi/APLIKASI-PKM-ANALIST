<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKM Analyst — Diagram Progres Penyisiran</title>

    <!-- Library Eksternal -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

        :root {
            --bg: #0a0c10;
            --bg-panel: #12151b;
            --bg-elevated: #191d25;
            --bg-input: #0f1218;
            --border: #262b35;
            --border-strong: #3a4150;
            --text: #e6e9ef;
            --text-dim: #9aa3b3;
            --text-faint: #59616f;
            --accent: #ff8a3d;
            --accent-soft: rgba(255,138,61,0.14);
            --accent2: #22c5b8;
            --accent2-soft: rgba(34,197,184,0.14);
            --success: #3ddc84;
            --warning: #f0b429;
            --danger: #ff6270;
            --info: #4f9cff;
            --mono: 'IBM Plex Mono', ui-monospace, monospace;
            --sans: 'IBM Plex Sans', system-ui, sans-serif;
        }

        * { box-sizing: border-box; }

        html, body { overflow-x: hidden; max-width: 100%; }

        body {
            font-family: var(--sans);
            background:
                radial-gradient(circle at 15% -10%, rgba(255,138,61,0.05), transparent 40%),
                radial-gradient(circle at 100% 0%, rgba(34,197,184,0.05), transparent 35%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        ::selection { background: var(--accent); color: #0a0c10; }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-panel); }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

        .mono { font-family: var(--mono); }

        /* ===== App Chrome ===== */
        .app-shell { max-width: 1760px; margin: 0 auto; padding: 18px 20px 60px; }

        .titlebar {
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(180deg, #14171e, #101319);
            border: 1px solid var(--border);
            border-radius: 10px 10px 0 0;
            padding: 10px 16px;
        }
        .titlebar-left { display: flex; align-items: center; gap: 12px; }
        .app-glyph {
            width: 30px; height: 30px; border-radius: 7px;
            background: linear-gradient(135deg, var(--accent), #c9581a);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset, 0 4px 10px rgba(255,138,61,0.25);
            flex-shrink: 0;
        }
        .app-name { font-family: var(--mono); font-weight: 600; font-size: 13px; letter-spacing: 0.06em; color: var(--text); }
        .app-name .dim { color: var(--text-faint); font-weight: 500; }
        .titlebar-right { display: flex; align-items: center; gap: 10px; }
        .status-pill {
            display: flex; align-items: center; gap: 7px;
            font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--text-dim); background: var(--bg-elevated); border: 1px solid var(--border);
            padding: 5px 10px; border-radius: 20px;
        }
        .status-dot {
            width: 6px; height: 6px; border-radius: 50%; background: var(--success);
            box-shadow: 0 0 0 3px rgba(61,220,132,0.15);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

        /* ===== Menu / Toolbar ===== */
        .menubar {
            display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
            background: var(--bg-panel);
            border: 1px solid var(--border); border-top: none;
            padding: 10px 14px;
        }
        .menu-divider { width: 1px; align-self: stretch; background: var(--border); margin: 0 2px; }
        .btn-tool {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
            padding: 9px 14px; border-radius: 7px; border: 1px solid var(--border-strong);
            background: var(--bg-elevated); color: var(--text-dim);
            cursor: pointer; transition: all .15s ease;
        }
        .btn-tool svg { width: 14px; height: 14px; flex-shrink: 0; }
        .btn-tool:hover { color: var(--text); border-color: var(--text-faint); background: #1f242f; }
        .btn-tool.primary { background: var(--accent); border-color: var(--accent); color: #1a0d02; }
        .btn-tool.primary:hover { background: #ff9a58; }
        .btn-tool.accent2 { background: transparent; border-color: var(--accent2); color: var(--accent2); }
        .btn-tool.accent2:hover { background: var(--accent2-soft); }
        .btn-tool.ghost { background: transparent; }
      .btn-tool.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn-tool.danger:hover { background: rgba(255,98,112,0.12); }
.filter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.filter-input { padding: 8px 10px !important; font-size: 11px !important; width: auto; }
        .btn-tool.file-tool { position: relative; }

        /* ===== Input / Inspector Panel ===== */
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border); border-top: none;
            padding: 18px 16px;
        }
        .panel-bottom { border-radius: 0 0 10px 10px; }
        .field-label {
            display: block; font-family: var(--mono); font-size: 9.5px; font-weight: 600;
            letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 7px;
        }
        .field-input {
            width: 100%; padding: 11px 12px; background: var(--bg-input);
            border: 1px solid var(--border-strong); border-radius: 7px;
            color: var(--text); font-family: var(--mono); font-size: 13px; font-weight: 500;
            outline: none; transition: border-color .15s ease, box-shadow .15s ease;
        }
        .field-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .field-input option { background: var(--bg-elevated); color: var(--text); }
        .btn-submit {
            width: 100%; height: 45px; background: var(--accent); color: #1a0d02;
            font-family: var(--mono); font-weight: 700; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
            border-radius: 7px; border: none; cursor: pointer; transition: background .15s ease;
        }
        .btn-submit:hover { background: #ff9a58; }

        /* ===== Report Canvas (tetap terang untuk print & export) ===== */
        .canvas-wrap {
            padding: 26px 0 30px;
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 28px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 28px);
        }

        .report-canvas {
            background: #fbfbf9;
            padding: 22px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #1c2230;
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.02);
            position: relative;
        }
        .report-corner {
            position: absolute; width: 14px; height: 14px; border-color: #1c2230; opacity: 0.7;
        }
        .report-corner.tl { top: 8px; left: 8px; border-top: 2px solid; border-left: 2px solid; }
        .report-corner.tr { top: 8px; right: 8px; border-top: 2px solid; border-right: 2px solid; }
        .report-corner.bl { bottom: 8px; left: 8px; border-bottom: 2px solid; border-left: 2px solid; }
        .report-corner.br { bottom: 8px; right: 8px; border-bottom: 2px solid; border-right: 2px solid; }

        .report-header { text-align: center; margin-bottom: 18px; border-bottom: 3px solid #14171f; padding-bottom: 14px; }
        .report-header h2 {
            font-family: var(--sans); font-weight: 700; font-size: 27px; letter-spacing: 0.06em;
            text-transform: uppercase; color: #14171f; margin: 0 0 8px;
        }
        .report-meta {
            display: flex; justify-content: center; gap: 22px; font-family: var(--mono);
            font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7280;
        }
        .report-meta b { color: #14171f; }

        .diagram-container { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

        .route-row {
    display: flex; flex-direction: column; border: 1px solid #14171f; background: #fff;
    min-height: 100px; position: relative; break-inside: avoid; border-radius: 2px; overflow: hidden;
      }

        .route-label-side {
    width: 100%; min-height: 42px; background: #14171f; color: #fff; padding: 9px 14px;
    display: flex; flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: nowrap; gap: 12px;
    border-bottom: 1px solid #14171f; flex-shrink: 0; overflow: hidden;
    position: relative;
}
.route-label-side .route-name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;
}
.route-label-side .route-stats {
    display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex-shrink: 0;
}
.route-label-side .route-stats span {
    font-size: 9px; opacity: 0.65; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap;
          }
.route-label-side::before {
    content: ''; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: var(--accent);
}

        .chart-area-horizontal {
            flex: 1; min-width: 0; position: relative; background-color: #ffffff;
            display: flex; flex-direction: column; padding: 5px clamp(8px, 2vw, 26px);
        }

        .lane-horizontal { width: 100%; height: 22px; position: relative; margin-bottom: 3px; }

        .bar-segment-horizontal {
    position: absolute; height: 85%; top: 7.5%; border-radius: 2px;
    display: flex; align-items: center; justify-content: flex-end;
    z-index: 10; border: 1px solid rgba(0,0,0,0.25);
    overflow: hidden; padding-right: 2px;
}
.bar-label {
    writing-mode: vertical-rl; text-orientation: mixed;
    color: #10120f; font-family: var(--mono); font-size: 6px; font-weight: 700;
    line-height: 1; letter-spacing: -0.3px; white-space: nowrap;
    max-height: 100%;
}

        .x-axis-top { position: relative; height: 22px; border-bottom: 2px solid #14171f; margin-bottom: 5px; }
        .axis-tick {
            position: absolute; transform: translateX(-50%); font-family: var(--mono);
            font-size: 10.5px; font-weight: 700; color: #14171f; top: 0;
        }
        .grid-line { position: absolute; top: 22px; bottom: 0; width: 1px; background-color: #eef0ee; z-index: 1; }

        /* ===== Data Table ===== */
        .data-panel {
            background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px;
            overflow: hidden; margin-bottom: 40px;
        }
        .data-panel-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 13px 18px; border-bottom: 1px solid var(--border); background: var(--bg-elevated);
        }
        .data-panel-title {
            font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--text-dim);
        }
        .data-table { width: 100%; border-collapse: collapse; font-family: var(--sans); }
        .data-table thead th {
            text-align: left; font-family: var(--mono); font-size: 9.5px; font-weight: 600;
            letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-faint);
            padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--bg-panel);
        }
        .data-table tbody td {
            padding: 13px 18px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--border);
        }
        .data-table tbody tr { transition: background .1s ease; }
        .data-table tbody tr:hover { background: var(--bg-elevated); }
        .data-table tbody tr:last-child td { border-bottom: none; }
        .route-chip {
            font-family: var(--mono); font-weight: 600; font-size: 11.5px; letter-spacing: 0.03em;
            color: var(--accent2); text-transform: uppercase;
        }
        .val-mono { font-family: var(--mono); color: var(--text-dim); }
        .row-actions { text-align: right; }
        .row-actions button {
            font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: 0.07em;
            text-transform: uppercase; background: none; border: none; cursor: pointer; padding: 4px 8px;
        }
        .row-actions .edit-action { color: var(--info); }
        .row-actions .edit-action:hover { text-decoration: underline; }
        .row-actions .delete-action { color: var(--danger); }
        .row-actions .delete-action:hover { text-decoration: underline; }
        .empty-row td { text-align: center; padding: 40px 18px; color: var(--text-faint); font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }

        /* ===== Status Bar ===== */
        .status-bar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
            background: #0d0f14; border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 18px; font-family: var(--mono); font-size: 10px; color: var(--text-faint);
            letter-spacing: 0.05em;
        }
        .status-bar-group { display: flex; align-items: center; gap: 18px; }
        .status-bar b { color: var(--text-dim); }
        .status-bar .accent-txt { color: var(--accent); }
        .status-bar .accent2-txt { color: var(--accent2); }

        /* ===== Loader ===== */
        #loader {
            display: none; position: fixed; inset: 0; background: rgba(10,12,16,0.88); z-index: 9999;
            flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(2px);
        }
        .loader-ring {
            width: 46px; height: 46px; border-radius: 50%;
            border: 3px solid var(--border-strong); border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loader p { margin-top: 18px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); }

        /* ===== Modal ===== */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(5,6,9,0.75); z-index: 9998;
            align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(3px);
        }
        .modal-box {
            background: var(--bg-panel); border: 1px solid var(--border-strong); border-radius: 14px;
            width: 100%; max-width: 620px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }
        .modal-header { padding: 20px 22px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text); }
        .modal-subtitle { font-family: var(--mono); font-size: 10px; color: var(--text-faint); margin-top: 4px; letter-spacing: 0.04em; }
        .modal-close {
            width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; background: var(--bg-elevated); border: 1px solid var(--border);
            color: var(--text-dim); font-size: 16px; font-weight: 700; cursor: pointer;
        }
        .modal-close:hover { color: var(--text); border-color: var(--text-faint); }
        .modal-body { padding: 18px 22px; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 18px 22px; border-top: 1px solid var(--border); background: var(--bg-elevated); }
        .modal-footer-label { font-family: var(--mono); font-size: 9.5px; font-weight: 600; color: var(--text-faint); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
        .route-item {
            display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; margin-bottom: 8px;
            border-radius: 8px; border: 1px solid var(--border); background: var(--bg-elevated);
        }
        .route-item-name { font-family: var(--sans); font-weight: 600; font-size: 13px; color: var(--text); }
        .route-item-meta { font-family: var(--mono); font-size: 9.5px; color: var(--text-faint); letter-spacing: 0.04em; text-transform: uppercase; margin-top: 3px; }
        .route-item-del { color: var(--danger); font-family: var(--mono); font-weight: 700; font-size: 9.5px; letter-spacing: 0.07em; text-transform: uppercase; background: none; border: none; cursor: pointer; flex-shrink: 0; margin-left: 14px; }
        .route-item-del:hover { text-decoration: underline; }
        .empty-routes { text-align: center; color: var(--text-faint); font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 40px 0; }

        /* --- OPTIMASI PRINT (Target Setengah Halaman A4) --- */
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0 !important; margin: 0 !important; }

            .report-canvas {
                border: 2px solid #000;
                padding: 10px !important;
                width: 100% !important;
                min-width: unset !important;
                transform: scale(0.55);
                transform-origin: top left;
                margin: 0 !important;
                box-shadow: none !important;
            }

            .diagram-container {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 8px !important;
            }
            .route-row { min-height: 60px !important; }
            .route-label-side { width: 100% !important; }

            @page {
                size: A4 portrait;
                margin: 5mm;
            }
        }

        @media (max-width: 900px) {
            .status-bar-group.secondary { display: none; }
        }
    </style>
</head>
<body class="p-4 pb-14">

    <div id="loader">
        <div class="loader-ring"></div>
        <p>Memproses Data...</p>
    </div>

    <!-- Modal Pengaturan Rute -->
    <div id="settingsModal" class="no-print modal-overlay">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div>
                    <h3 class="modal-title">Pengaturan Rute</h3>
                    <p cla
